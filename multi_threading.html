
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java - MULTI_THREADING</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #F3F4FA;
    color: #28345C;
}

/* Header */
.header {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    background: #28345C;
    color: #FFFFFF;
    margin-bottom: 25px;
}

/* Question Box */
.query-box {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(40, 52, 92, 0.07);
}

.query-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Buttons */
button {
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: #28345C;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6556B8;
}

/* Answer Section */
.answer {
    display: none;
    margin-top: 18px;
    border-top: 2px solid #D6D9EA;
    padding-top: 15px;
}

.answer-container {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

/* Code and Output */
.query-code,
.output {
    flex: 1;
    min-width: 0;
    background: #F3F4FA;
    padding: 15px;
    border: 1px solid #D6D9EA;
    border-radius: 8px;
    overflow: auto;
}

.query-code h3,
.output h3 {
    margin-top: 0;
    font-size: 17px;
    color: #28345C;
}

/* Java Code */
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;
}

/* Reference Link */
.reference {
    display: inline-block;
    margin-top: 15px;
    color: #6556B8;
    text-decoration: none;
    font-weight: bold;
}

.reference:hover {
    text-decoration: underline;
}

/* Empty Content */
.empty {
    color: #777777;
    font-style: italic;
    font-family: Arial, sans-serif;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .header {
        font-size: 21px;
    }

    .answer-container {
        flex-direction: column;
    }

    .query-code,
    .output {
        width: 100%;
    }
}
</style>
</head>

  source_code: `package multi_threading;

class even extends Thread{
	public void run(){
		System.out.println("Even numbers for 0 to 20");
		for(int i = 1;i<=20;i++){
			if(i%2==0){
				System.out.println(i);
			}

	public void run(){
		System.out.println("odd numbers for 0 to 20");
		for(int i = 1;i<=20;i++){
			if(i%2 !=0){
				System.out.println(i);
			}
		}
	}
}

  question: "3. Write a Java program that sorts an array of integers using multiple threads.",
  source_code: `package multi_threading;

 class sort_array extends Thread{
	public void run(){
		int arr[] = {3,8,6,3,5,9,2};
		int len = arr.length;
		int temp ;
		for(int i = 0 ; i<len;i++){
			for(int j = i+1;j<arr.length;j++){
				if(arr[i]>arr[j]){
					temp = arr[i];
					arr[i] = arr[j];
					arr[j] = temp;
				}
			}
		}
		System.out.println("After sorting");
		for(int i = 0;i<len;i++){
			System.out.println(arr[i]);
		}
	}
}


class Q3{
	public static void main(){
		sort_array sa = new sort_array();
		sa.start();

	}	
}`,

  question: "4. Write a Java program that performs matrix multiplication using multiple threads.",
  source_code: `package multi_threading;

 class multi_matrix extends Thread{
	public void run(){
		int arr1[][] = {{3,8},{6,3}};
		int arr2[][] = {{3,4},{9,3}};
		int arr3[][] = new int[2][2];
		for(int i = 0 ; i<arr1.length;i++){
			for(int j = 0;j<arr1.length;j++){
				for(int k = 0;k<arr1[0].length;k++){
					arr3[i][j] += arr1[i][k] * arr2[k][j];
				}
			}
		}
		System.out.println("matrix mutliplication");
		for(int i = 0;i<arr3.length;i++){
			for(int j = 0;j<arr3[0].length;j++){
				System.out.print(arr3[i][j]+"\t");
			}
			System.out.println("\n");

	}
}


class Q4{

// ======================================
// SET PAGE TITLE
// ======================================

document.getElementById("SINGLED").textContent = topicData.title;


// ======================================
// DISPLAY QUESTIONS
// ======================================

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    const div = document.createElement("div");
    div.className = "query-box";

    // Question Title
    const title = document.createElement("div");
    title.className = "query-title";
    title.textContent = `${index + 1}. ${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);

    // Reference Link
    

    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});

</script>
