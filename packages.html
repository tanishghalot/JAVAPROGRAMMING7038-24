
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java - PACKAGES</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #F3F4FA;
    color: #28345C;
}

/* Header */
.header {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    background: #28345C;
    color: #FFFFFF;
    margin-bottom: 25px;
}

/* Question Box */
.query-box {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(40, 52, 92, 0.07);
}

.query-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Buttons */
button {
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: #28345C;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6556B8;
}

/* Answer Section */
.answer {
    display: none;
    margin-top: 18px;
    border-top: 2px solid #D6D9EA;
    padding-top: 15px;
}

.answer-container {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

/* Code and Output */
.query-code,
.output {
    flex: 1;
    min-width: 0;
    background: #F3F4FA;
    padding: 15px;
    border: 1px solid #D6D9EA;
    border-radius: 8px;
    overflow: auto;
}

.query-code h3,
.output h3 {
    margin-top: 0;
    font-size: 17px;
    color: #28345C;
}

/* Java Code */
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;
}

/* Reference Link */
.reference {
    display: inline-block;
    margin-top: 15px;
    color: #6556B8;
    text-decoration: none;
    font-weight: bold;
}

.reference:hover {
    text-decoration: underline;
}

/* Empty Content */
.empty {
    color: #777777;
    font-style: italic;
    font-family: Arial, sans-serif;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .header {
        font-size: 21px;
    }

    .answer-container {
        flex-direction: column;
    }

    .query-code,
    .output {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- Topic Header -->
<div class="header" id="SINGLED">
    PACKAGES
</div>

<!-- Questions -->
<div id="quesList"></div>

<script>

// ======================================
// JAVA PROGRAMMING QUESTIONS
// EDIT SOURCE CODE AND OUTPUT HERE
// ======================================

const topicData = {

    title: "PACKAGES",

    queries: [

        {
      question: "1. Create a Java program to access the java.util.Date class through import keyword and print the current date of the system.",
      source_code: `package packages;
import java.util.Date;
class Q1{
	public static void main(){
		Date d = new Date();
		System.out.println("Current date:"+d);
	}
}`,
      output: `E:\Java\practical file\package_source>javac -d . Q1.java

E:\Java\practical file\package_source>java packages.Q1
Current date:Mon Nov 02 15:06:13 IST 2026
`
    },
    {
      question: "2. Create a Java program to access the java.util.Date class through qualified way and print the current date of the system.",
      source_code: `package packages;

class Q2{
	public static void main(){
		java.util.Date d = new java.util.Date();
		System.out.println("Current date:"+d);
	}
}`,
      output: `E:\Java\practical file\package_source>javac -d . Q2.java

E:\Java\practical file\package_source>java packages.Q2
Current date:Mon Nov 02 15:06:22 IST 2026
`
    },
    {
      question: "3. Create a Java program to access the java.util.Date class through import keyword and print the current date of the system but inherit the Date class.",
      source_code: `package packages;
import java.util.Date;
class Q3 extends Date{
	public static void main(){
		Date d = new Date();
		System.out.println("Current date:"+d);
	}
}`,
      output: `E:\Java\practical file\package_source>javac -d . Q3.java

E:\Java\practical file\package_source>java packages.Q3
Current date:Mon Nov 02 15:06:29 IST 2026
`
    },
    {
      question: "4. Create a Java program to access the java.util.Date class through qualified way and print the current date of the system but inherit the Date class.",
      source_code: `package packages;
class Q4 extends java.util.Date{
	public static void main(){
		java.util.Date d = new java.util.Date();
		System.out.println("Current date:"+d);
	}
}`,
      output: `E:\Java\practical file\package_source>javac -d . Q4.java

E:\Java\practical file\package_source>java packages.Q4
Current date:Mon Nov 02 15:06:35 IST 2026
`
    },
    {
      question: "5. Create a Java program to create a package with multiple default classes.",
      source_code: `package packages;
class A{
	public void circle(){
		System.out.println("This is circle");
	}
}

class B{
	public void rectangle(){
		System.out.println("This is rectangle");
	}
}

class C{
	public void square(){
		System.out.println("This is square");
	}
}


class Q5{
	public static void main(){
		A a = new A();
		B b = new B();
		C c = new C();
		a.circle();
		b.rectangle();
		c.square();
	}

}`,
      output: `E:\Java\practical file\package_source>javac -d . Q5.java

E:\Java\practical file\package_source>java packages.Q5
This is circle
This is rectangle
This is square
`
    },
    {
      question: "6. Create a Java program to create a package with 4 public classes, create the object in another file and call the function created in those classes.",
      source_code: `package shapes;
public class circle{
	public void circle(double radius){
		double area = 2*3.14*radius;
		System.out.println("The area of circle is "+area);
	}
}

public class rectangle{
	public void rectangle(double l,double b){
		double area = l*b;
		System.out.println("The area of rectangle is "+area);	}
}

public class square{
	public void square_area(double side){
		double area = side*side;
		System.out.println("The area of square is "+area);
	}
}

import shapes.*;

class Q6{
	public static void main(String arg[]){
		circle cr = new circle();
		cr.circle_area(7);
		rectangle rec = new rectangle();
		rec.rectangle_area(4,6);
	}
}`,
      output: ``
    },
    {
      question: "7. Write a Java program to perform employee payroll processing using packages. In the java file, Emp.java creates a package employee and creates a class Emp. Declare the variables name, empid, category, bpay, hra, da, npay, pf, grosspay, incometax, and allowance. Calculate the values in methods. Create another java file Emppay.java. Create an object e to call the methods to perform and print values.",
      source_code: ``,
      output: ``
    },
    {
      question: "8. Create a Java program to create a package with public class and protected members to be accessed in another class.",
      source_code: ``,
      output: ``
    },
    {
      question: "9. Create a Java program to create a nested package i.e. c4.sample with public class and protected members to be accessed in another class.",
      source_code: ``,
      output: ``
    },
    {
      question: "10. Create a Java program to create a package with public class and public members to be accessed in another class.",
      source_code: ``,
      output: ``
    }

    ]
};


// ======================================
// SET PAGE TITLE
// ======================================

document.getElementById("SINGLED").textContent = topicData.title;


// ======================================
// DISPLAY QUESTIONS
// ======================================

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    const div = document.createElement("div");
    div.className = "query-box";

    // Question Title
    const title = document.createElement("div");
    title.className = "query-title";
    title.textContent = `${index + 1}. ${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);

    // Reference Link
    

    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});

</script>

</body>
</html>
