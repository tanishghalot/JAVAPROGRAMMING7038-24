* {

.answer-container {

/* Code and Output */

.query-code h3,

/* Java Code */
pre {

    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;

/* Empty Content */
.empty {

/* Responsive */

import java.io.*;
class BankAccount{
	private String name;
	protected double balance;
	public BankAccount(String name,double balance){
		this.name = name;
		this.balance = balance;
	}
	public void withdraw(double amount){
		System.out.println("Not yet withdrawl");
	}
	public void deposit(double amount){
		System.out.println("Not yet deposited");
	}
}

class SavingAccount extends BankAccount{
	public SavingAccount(String name , double balance){
		super(name,balance);
	}
	@Override
	public  void withdraw(double amount){
		if(amount>balance || (balance-amount)<=100){
			System.out.println("The withdrawl cannont be proceed");	
		}	
		else{
			System.out.println("Amount is withdrawed"+amount);
		}	
	}
	@Override
	public  void deposit(double amount){
			if (amount > 0) {
            balance = balance + amount;
            System.out.println("Amount deposited: " + amount);
        }
	}
	

}

    private String Fname;
    private String Lname;

        this.Lname = Lname;

class Shape{
	public double getPerimeter(){
		return 0;
	}
	public double getArea(){
		return 0;
	}
}

class Circle extends Shape{
	private double radius;
	public Circle(double radius){
		this.radius = radius;
	}
	@Override
	public double getPerimeter(){
		return 2*3.14*radius;
	}

	@Override
	public double getArea(){
		return 2*3.14*radius*radius;
	}		

}

document.getElementById("SINGLED").textContent = topicData.title;


// ======================================
// DISPLAY QUESTIONS
// ======================================

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    const div = document.createElement("div");
    div.className = "query-box";

    // Question Title
    const title = document.createElement("div");
    title.className = "query-title";
    title.textContent = `${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);


    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});
