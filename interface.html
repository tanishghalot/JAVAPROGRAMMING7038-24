
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java - INTERFACE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #F3F4FA;
    color: #28345C;
}

/* Header */
.header {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    background: #28345C;
    color: #FFFFFF;
    margin-bottom: 25px;
}

/* Question Box */
.query-box {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(40, 52, 92, 0.07);
}

.query-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Buttons */
button {
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: #28345C;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6556B8;
}

/* Answer Section */
.answer {
    display: none;
    margin-top: 18px;
    border-top: 2px solid #D6D9EA;
    padding-top: 15px;
}

.answer-container {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

/* Code and Output */
.query-code,
.output {
    flex: 1;
    min-width: 0;
    background: #F3F4FA;
    padding: 15px;
    border: 1px solid #D6D9EA;
    border-radius: 8px;
    overflow: auto;
}

.query-code h3,
.output h3 {
    margin-top: 0;
    font-size: 17px;
    color: #28345C;
}

/* Java Code */
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;
}

/* Empty Content */
.empty {
    color: #777777;
    font-style: italic;
    font-family: Arial, sans-serif;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .header {
        font-size: 21px;
    }

    .answer-container {
        flex-direction: column;
    }

    .query-code,
    .output {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- Topic Header -->
<div class="header" id="SINGLED">
    INTERFACES
</div>

<!-- Questions -->
<div id="quesList"></div>

<script>

// ======================================
// JAVA PROGRAMMING QUESTIONS
// EDIT SOURCE CODE AND OUTPUT HERE
// ======================================

const topicData = {

    title: "INTERFACE",

    queries: [
	{
        question:"1. Write a Java program to create an interface Shape with the getArea() method. Create three classes Rectangle, Circle, and Triangle that implement the Shape interface. Implement the getArea() method for each of the three classes.",
            source_code: `package interfacee;
interface Shape{
	double getArea();
}

class rectangle implements Shape{
	double length,breadth;
	
	rectangle(double length,double breadth){
		this.length = length;
		this.length = breadth;
	}
	
	public double getArea(){
		return length*breadth;
	}
}

class circle implements Shape{
	double radi;
	
	circle(double radi){
		this.radi = radi;
	}
	
	public double getArea(){
		return 3.14*radi*radi;
	}
}
class traingle implements Shape{
	double base,height;
	
	traingle(double base,double height){
		this.base = base;
		this.height = height;
	}
	
	public double getArea(){
		return 0.5*base*height;
	}
}

class main_Q1{
	public static void main(String arg[]){
		rectangle r = new rectangle(3,5);
		circle c = new circle(5.6);
		traingle t = new traingle(5,10);
		
		System.out.println("The area of rectangle is :"+r.getArea());
		System.out.println("The area of circle is :"+c.getArea());
		System.out.println("The area of traingle is :"+t.getArea());
	}
}`,
            output: `E:\Java\practical file\interface_source>javac -d . Q1.java

E:\Java\practical file\interface_source>java interfacee.main_Q1
The area of rectangle is :0.0
The area of circle is :98.4704
The area of traingle is :25.0
`
        },
        {
            question: "2. Write a Java program to create a Animal interface with a method called bark() that takes no arguments and returns void. Create a Dog class that implements Animal and overrides speak() to print \"Dog is barking\".",
            source_code: `package interfacee;
interface Animal{
	void bark();
}

class dog implements Animal{
	
	@Override
	public void bark(){
		System.out.print("Dog is barking");
	}
}

class main_Q2{
	public static void main(String arg[]){
		dog d = new dog();
		d.bark();
	}
}

`,
            output: `E:\Java\practical file\interface_source>javac -d . Q2.java

E:\Java\practical file\interface_source>java interfacee.main_Q2
Dog is barking`
        },
        {
            question: "3. Write a Java program to create an interface Flyable with a method called fly_obj(). Create three classes Spacecraft, Airplane, and Helicopter that implement the Flyable interface. Implement the fly_obj() method for each of the three classes.",
            source_code: `package interfacee;
interface flyable{

class airplane implements flyable{

	public void fly_obj(){

	}
}

class helicopter implements flyable{

	public void fly_obj(){
		System.out.println("This is helicopter");
	}
}

class main_Q3{
	public static void main(String arg[]){
		spacecraft s = new spacecraft();
		airplane a = new airplane();

		s.fly_obj();
		a.fly_obj();
		h.fly_obj();
	}
}

`,
            output: `E:\Java\practical file\interface_source>javac -d . Q3.java

E:\Java\practical file\interface_source>java interfacee.main_Q3
This is spacecraft
This is airplane
This is helicopter
`
        },
        {
            question: "4. Write a Java programming to create a banking system with three classes - Bank, Account, SavingsAccount, and CurrentAccount. The bank should have a list of accounts and methods for adding them. Accounts should be an interface with methods to deposit, withdraw, calculate interest, and view balances. SavingsAccount and CurrentAccount should implement the Account interface and have their own unique methods.",
            source_code: ``,
            output: ``
        },
        {
            question: "5. Write a Java program to create an interface Resizable with methods resizeWidth(int width) and resizeHeight(int height) that allow an object to be resized. Create a class Rectangle that implements the Resizable interface and implements the resize methods.",
            source_code: ``,
            output: ``
        },
        {
            question: "6. Write a Java program to create an interface Drawable with a method draw() that takes no arguments and returns void. Create three classes Circle, Rectangle, and Triangle that implement the Drawable interface and override the draw() method to draw their respective shapes.",
            source_code: ``,
            output: ``
        },
        {
            question: "7. Write a Java program to create an interface Sortable with a method sort() that sorts an array of integers in ascending order. Create two classes BubbleSort and SelectionSort that implement the Sortable interface and provide their own implementations of the sort() method.",
            source_code: ``,
            output: ``
        },
        {
            question: "8. Write a Java program to create an interface Playable with a method play() that takes no arguments and returns void. Create three classes Football, Volleyball, and Basketball that implement the Playable interface and override the play() method to play the respective sports.",
            source_code: ``,
            output: ``
        },
        {
            question: "9. Write a Java program to create an interface Searchable with a method search(String keyword) that searches for a given keyword in a text document. Create two classes Document and WebPage that implement the Searchable interface and provide their own implementations of the search() method.",
            source_code: ``,
            output: ``
        },
        {
            question: "10. Write a Java program to create an interface Encryptable with methods encrypt(String data) and decrypt(String encryptedData) that define encryption and decryption operations. Create two classes AES and RSA that implement the Encryptable interface and provide their own encryption and decryption algorithms.",
            source_code: ``,
            output: ``
        },
        {
            question: "11. Write a Java program to create an interface Sortable with a method sort(int[] array) that sorts an array of integers in descending order. Create two classes QuickSort and MergeSort that implement the Sortable interface and provide their own implementations of the sort() method.",
            source_code: ``,
            output: ``
        }

    ]
};


// ======================================
// SET PAGE TITLE
// ======================================

document.getElementById("SINGLED").textContent = topicData.title;


// ======================================
// DISPLAY QUESTIONS
// ======================================

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    const div = document.createElement("div");
    div.className = "query-box";

    // Question Title
    const title = document.createElement("div");
    title.className = "query-title";
    title.textContent = `${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);


    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});

</script>

</body>
</html>
