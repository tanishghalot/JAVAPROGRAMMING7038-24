<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #F3F4FA;
    color: #28345C;
}

/* Header */
.header {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    background: #28345C;
    color: #FFFFFF;
    margin-bottom: 25px;
}

/* Question Box */
.query-box {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(40, 52, 92, 0.07);
}

.query-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Buttons */
button {
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: #28345C;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6556B8;
}

/* Answer Section */
.answer {
    display: none;
    margin-top: 18px;
    border-top: 2px solid #D6D9EA;
    padding-top: 15px;
}

.answer-container {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

/* Code and Output */
.query-code,
.output {
    flex: 1;
    min-width: 0;
    background: #F3F4FA;
    padding: 15px;
    border: 1px solid #D6D9EA;
    border-radius: 8px;
    overflow: auto;
}

.query-code h3,
.output h3 {
    margin-top: 0;
    font-size: 17px;
    color: #28345C;
}

/* Java Code */
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;
}

/* Reference Link */
.reference {
    display: inline-block;
    margin-top: 15px;
    color: #6556B8;
    text-decoration: none;
    font-weight: bold;
}

.reference:hover {
    text-decoration: underline;
}

/* Empty Content */
.empty {
    color: #777777;
    font-style: italic;
    font-family: Arial, sans-serif;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .header {
        font-size: 21px;
    }

    .answer-container {
        flex-direction: column;
    }

    .query-code,
    .output {
        width: 100%;
    }
}
</style>
</head>

            source_code: `package function;

class Q7{
	public static void main(String agr[]){
		String str;
		str = "Tanishkumar";
		validate_passwd(str);
	}
	
	public static void validate_passwd(String str){
		int len = str.length();
		int symbolcount = 0;
		int uppcount = 0;
		int lowcount = 0;	
		if(len<8){
			System.out.print("The length of password is minimum 8 characters");
			return;
		}
		for(int i = 0;i<len;i++){
			if((int)str.charAt(i)>=33 && (int)str.charAt(i) <=47){
				symbolcount++;
			}
			else if((int)str.charAt(i)>=65 && (int)str.charAt(i) <=90){
				uppcount++;
			}
			else if((int)str.charAt(i)>=97 && (int)str.charAt(i) <=122){
				lowcount++;
			}
		}
		if(symbolcount<=0){
			System.out.print("The password should contain atleast one symbol");
			return;
		}
		else if(uppcount<=0){
			System.out.print("The password should contain atleast one uppercase character");
			return;
		}
		else if(lowcount<=0){
			System.out.print("The password should contain atleast one lowercase character");
		}
		else{
			System.out.print("The password is strong");
		}
	}

    public static void main(String agr[]) {
        try(BufferedReader br = new BufferedReader(new InputStreamReader(System.in))) {
            System.out.print("Enter a number: ");
            String str = br.readLine();

            count_digit(num);
        }

            System.out.println("An error occurred");
        }
    }

    public static void count_digit(int num) {
        int i = num;
        int rem = 0;
        int count = 0;
        while(i > 0) {
            rem = i % 10;
            if(rem == 2) {
                count++;
            }
            i = i / 10;
        }

        System.out.println("Digit 2 appears " + count + " times.");
    }
}

	public static void main(String agr[]){

			}

				System.out.println("The one is not middle point between other two");

			System.out.println("An error occurred");
		}

		public static boolean midpoint_num(int num1,int num2,int num3){
			int mid1 = Math.abs(num1-num2)/2;
			int  mid2 = Math.abs(num1-num3)/2;

			if(num1 == mid3+num2){

			}
			else if(num2 == mid2+num1){
				return true;
			}
			else if(num3 == mid1+num1){
				return true;
			}
			else{
				return false;
			}
		}

import java.io.*;
class Q13{
	public static void main(String agr[]){
		try(BufferedReader br = new BufferedReader(new InputStreamReader(System.in)))		{
			String str = br.readLine();
			Boolean b = vowel(str);
			if(b){
				System.out.println("String consist of all vowel only");
			}
			else{
				System.out.println("String does not consist of vowels");
			}
		}
		catch(IOException e){
			System.out.println("An error occurred");
		}
		}

		public static boolean vowel(String str){
			int len = str.length();
			int vowels[] = {'a','e','i','o','u'};
			for(int i=0;i<len;i++){
				boolean v = false;
				char ch = Character.toLowerCase(str.charAt(i));
				for(int j = 0;j<5;j++){
					if( ch == vowels[j]){
						v = true;
						break;
					}
				}
				if(!v){
					return false;
				}
			}
			return true;
			
		}
}`,

// DISPLAY QUESTIONS

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    // Question Title

    title.className = "query-title";
    title.textContent = `${index + 1}. ${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);

    // Reference Link
    

    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});
