
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java - OOPS </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #F3F4FA;
    color: #28345C;
}

/* Header */
.header {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    background: #28345C;
    color: #FFFFFF;
    margin-bottom: 25px;
}

/* Question Box */
.query-box {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(40, 52, 92, 0.07);
}

.query-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Buttons */
button {
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: #28345C;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6556B8;
}

/* Answer Section */
.answer {
    display: none;
    margin-top: 18px;
    border-top: 2px solid #D6D9EA;
    padding-top: 15px;
}

.answer-container {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

/* Code and Output */
.query-code,
.output {
    flex: 1;
    min-width: 0;
    background: #F3F4FA;
    padding: 15px;
    border: 1px solid #D6D9EA;
    border-radius: 8px;
    overflow: auto;
}

.query-code h3,
.output h3 {
    margin-top: 0;
    font-size: 17px;
    color: #28345C;
}

/* Java Code */
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;
}

/* Empty Content */
.empty {
    color: #777777;
    font-style: italic;
    font-family: Arial, sans-serif;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .header {
        font-size: 21px;
    }

    .answer-container {
        flex-direction: column;
    }

    .query-code,
    .output {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- Topic Header -->
<div class="header" id="SINGLED">
   OBJECT ORIENTED PROGRAMMING
</div>

<!-- Questions -->
<div id="quesList"></div>

<script>

// ======================================
// JAVA PROGRAMMING QUESTIONS
// EDIT SOURCE CODE AND OUTPUT HERE
// ======================================

const topicData = {

    title: "OOPS",

    queries: [
      {
      question: "Write a Java program to create a class called \"Person\" with a name and age attribute. Create two instances of the \"Person\" class, set their attributes using the constructor, and print their name and age.",
      source_code: `package oop;

class person{
		String 	name;
		int age;
		
		person(String name,int age){
			this.name = name;
			this.age = age;
		}
		public static void main(String arg[]){
			person p1 = new person("tanish",21);
			person p2 = new person("Arnav",22);
			System.out.println(p1.name + " "+p1.age); 	
			System.out.println(p2.name + " "+p2.age); 	
	
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q1.java

E:\Java\practical file\Oops_source>java oop.person
tanish 21
Arnav 22
`
    },
    {
      question: "Write a Java program to create a class called \"Dog\" with a name and breed attribute. Create two instances of the \"Dog\" class, set their attributes using the constructor and modify the attributes using the setter methods and print the updated values.",
      source_code: `package oop;

class dog{
		String 	name;
		String breed;
		
		dog(String name,String breed){
			this.name = name;
			this.breed = breed;
		}
		
		void setname(){
			this.name = name;	
		}

		void setBreed(String breed){
			this.breed = breed;
		}

		public static void main(String arg[]){
			dog d1 = new dog("Tommy","pug");
			dog d2 = new dog("Bravo","Labrador");
			System.out.println(d1.name + " "+d1.breed); 	
			System.out.println(d2.name + " "+d2.breed); 	
	
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q2.java

E:\Java\practical file\Oops_source>java oop.dog
Tommy pug
Bravo Labrador
`
    },
    {
      question: "Write a Java program to create a class called \"Rectangle\" with width and height attributes. Calculate the area and perimeter of the rectangle.",
      source_code: `package oop;

class rectangle{
		double width;
		double height;
		
		rectangle(double width,double height){
			this.width = width;
			this.height = height;
		}
		
		double area(){
			return width*height;	
		}

		double perimeter(){
			return 2*(width+height);
		}

		public static void main(String arg[]){
			rectangle r1 = new rectangle(5,10);
			System.out.println("Area "+r1.area()); 	
			System.out.println("perimeter :"+r1.perimeter()); 	
	
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q3.java

E:\Java\practical file\Oops_source>java oop.rectangle
Area 50.0
perimeter :30.0
`
    },
    {
      question: "Write a Java program to create a class called \"Circle\" with a radius attribute. You can access and modify this attribute. Calculate the area and circumference of the circle.",
      source_code: `package oop;

class circle{
		double radius;
		
		circle(double radius){
			this.radius = radius;
		}
		
		double area(){
			return 3.14*radius*radius;	
		}

		double circumference(){
			return 2*3.14*radius;
		}

		public static void main(String arg[]){
			circle c1 = new circle(6);
			System.out.println("Area "+c1.area()); 	
			System.out.println("circumference :"+c1.circumference()); 	
	
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q4.java

E:\Java\practical file\Oops_source>java oop.circle
Area 113.03999999999999
circumference :37.68
`
    },
    {
      question: "Write a Java program to create a class called \"Book\" with attributes for title, author, and ISBN, and methods to add and remove books from a collection.",
      source_code: `package oop;
import java.util.*;
class Book{
		String title;
		String author;
		String ISBN;
		
		Book(String title,String author,String ISBN){
			this.title = title;
			this.author = author ;
			this.ISBN = ISBN;
		}
		
		public static void main(String arg[]){
			ArrayList<Book> books = new ArrayList<>();
			Book b1 = new Book("Java","james","101");
			books.add(b1);

			for(Book b : books){
				System.out.println(b1.title+" "+b.author+" "+b.ISBN);
			}	
			
			books.remove(b1);
			System.out.println("After removing");
			
			for(Book b : books){
				System.out.println(b.title);
			} 	
	
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q5.java

E:\Java\practical file\Oops_source>java oop.Book
Java james 101
After removing
`
    },
    {
      question: "Write a Java program to create a class called \"Employee\" with a name, job title, and salary attributes, and methods to calculate and update salary.",
      source_code: `package oop;
import java.util.*;
class employee{
		String name;
		String jobtitle;
		double salary;
		int bonus = 3000;
		employee(String name,String jobtitle,double salary){
			this.name = name;
			this.jobtitle = jobtitle ;
			this.salary = salary;
		}
		
		double calculateSalary(){
			return salary+bonus;
		}
		
		void updatesalary(double salary){
			this.salary = salary;
		}
	
		public static void main(String arg[]){
			employee e = new employee("Aman","developer",30000);
			System.out.println("Salary:"+e.salary);
			System.out.println("salary with bonus : "+e.calculateSalary());			
			e.updatesalary(40000);
			System.out.println();
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q6.java

E:\Java\practical file\Oops_source>java oop.employee
Salary:30000.0
salary with bonus : 33000.0
`
    },
    {
      question: "Write a Java program to create class called \"TrafficLight\" with attributes for color and duration, and methods to change the color and check for red or green.",
      source_code: `package oop;
import java.util.*;
class trafficlight{
		String color;
		int duration;

		trafficlight(String color,int duration){
			this.color = color;
			this.duration = duration;
			
		}
		
		void changecolor(String color){
			this.color = color;
		}
		
		boolean isRed(){
			return color.equalsIgnoreCase("Red");
		}
		boolean isGreen(){
			return color.equalsIgnoreCase("Green");
		}
	
		public static void main(String arg[]){
			trafficlight tl = new trafficlight("red",30);
			System.out.println("Red:"+tl.isRed());
			System.out.println("Green:"+tl.isGreen());			
			tl.changecolor("Green");
			System.out.println("New color:"+tl.color);
			System.out.println("Green:"+tl.isGreen());
		}
}`,
      output: `E:\Java\practical file\Oops_source>javac -d . Q8.java

E:\Java\practical file\Oops_source>java oop.trafficlight
Red:true
Green:false
New color:Green
Green:true
`
    }
    ]
};


// ======================================
// SET PAGE TITLE
// ======================================

document.getElementById("SINGLED").textContent = topicData.title;


// ======================================
// DISPLAY QUESTIONS
// ======================================

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    const div = document.createElement("div");
    div.className = "query-box";

    // Question Title
    const title = document.createElement("div");
    title.className = "query-title";
    title.textContent = `${index + 1}. ${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);


    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});

</script>

</body>
</html>
