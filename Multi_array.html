
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java - Multi Dimension array</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #F3F4FA;
    color: #28345C;
}

/* Header */
.header {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    background: #28345C;
    color: #FFFFFF;
    margin-bottom: 25px;
}

/* Question Box */
.query-box {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(40, 52, 92, 0.07);
}

.query-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Buttons */
button {
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: #28345C;
    color: #FFFFFF;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6556B8;
}

/* Answer Section */
.answer {
    display: none;
    margin-top: 18px;
    border-top: 2px solid #D6D9EA;
    padding-top: 15px;
}

.answer-container {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

/* Code and Output */
.query-code,
.output {
    flex: 1;
    min-width: 0;
    background: #F3F4FA;
    padding: 15px;
    border: 1px solid #D6D9EA;
    border-radius: 8px;
    overflow: auto;
}

.query-code h3,
.output h3 {
    margin-top: 0;
    font-size: 17px;
    color: #28345C;
}

/* Java Code */
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #28345C;
    margin: 0;
}

/* Empty Content */
.empty {
    color: #777777;
    font-style: italic;
    font-family: Arial, sans-serif;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        padding: 12px;
    }

    .header {
        font-size: 21px;
    }

    .answer-container {
        flex-direction: column;
    }

    .query-code,
    .output {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- Topic Header -->

import java.io.*;
class Q1{
	public static void main(String args[]) {
		try(BufferedReader br = new BufferedReader(new InputStreamReader(System.in)))
		{
			
		System.out.println("Enter number of Rows:");
		String str1 = br.readLine();
		int rows = Integer.parseInt(str1);
		System.out.println("Enter number of columns:");
		String str2 = br.readLine();
		int cols = Integer.parseInt(str2);
		int arr[][] = new int[rows][cols];
		System.out.println("Enter matrix elements:");
		int num;
		for(int i = 0;i<rows;i++){
			for(int j = 0;j<cols;j++){
				String str3 = br.readLine();
				num = Integer.parseInt(str3);
				arr[i][j] = num;
			}
		}
		for(int i = 0;i<rows;i++){
			for(int j = 0;j<cols;j++){
				System.out.print(arr[i][j] + "\t");
			}
			System.out.print("\n");
		}
		}
		catch(IOException e){
			System.out.print("An error occured");			
		}	
	}

// ======================================
// SET PAGE TITLE
// ======================================

document.getElementById("SINGLED").textContent = topicData.title;


// ======================================
// DISPLAY QUESTIONS
// ======================================

const container = document.getElementById("quesList");

topicData.queries.forEach((q, index) => {

    const div = document.createElement("div");
    div.className = "query-box";

    // Question Title
    const title = document.createElement("div");
    title.className = "query-title";
    title.textContent = `${q.question}`;

    // Show Answer Button
    const button = document.createElement("button");
    button.textContent = "Show Answer";

    // Answer Section
    const answer = document.createElement("div");
    answer.className = "answer";

    // Answer Container
    const answerContainer = document.createElement("div");
    answerContainer.className = "answer-container";

    // Source Code
    const codeBox = document.createElement("div");
    codeBox.className = "query-code";

    const codeHeading = document.createElement("h3");
    codeHeading.textContent = "Java Source Code";

    const code = document.createElement("pre");

    code.textContent = q.source_code.trim()
        ? q.source_code
        : "Java source code not added yet.";

    if (!q.source_code.trim()) {
        code.className = "empty";
    }

    codeBox.appendChild(codeHeading);
    codeBox.appendChild(code);

    // Output
    const outputBox = document.createElement("div");
    outputBox.className = "output";

    const outputHeading = document.createElement("h3");
    outputHeading.textContent = "Output";

    const output = document.createElement("pre");

    output.textContent = q.output.trim()
        ? q.output
        : "Output not added yet.";

    if (!q.output.trim()) {
        output.className = "empty";
    }

    outputBox.appendChild(outputHeading);
    outputBox.appendChild(output);

    // Add both boxes
    answerContainer.appendChild(codeBox);
    answerContainer.appendChild(outputBox);

    answer.appendChild(answerContainer);


    // Button Functionality
    button.addEventListener("click", function () {

        if (answer.style.display === "block") {

            answer.style.display = "none";
            button.textContent = "Show Answer";

        } else {

            answer.style.display = "block";
            button.textContent = "Hide Answer";

        }

    });

    // Add everything to page
    div.appendChild(title);
    div.appendChild(button);
    div.appendChild(answer);

    container.appendChild(div);

});

</html>
